services:
  postgres:
    image: postgres:16
    container_name: bdnifi-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    container_name: bdnifi-kafka
    ports:
      - "${KAFKA_HOST_PORT}:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP} --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  nifi:
    build: .
    image: bdnifi-nifi:lab5
    container_name: bdnifi-nifi
    env_file:
      - .env
    environment:
      NIFI_WEB_HTTP_PORT: ${NIFI_WEB_HTTP_PORT}
      NIFI_WEB_HTTPS_PORT: ""
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 768m
    ports:
      - "${NIFI_PORT}:8080"
    volumes:
      - nifidata:/opt/nifi/nifi-current/conf
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  producer:
    build: ./producer
    container_name: bdnifi-producer
    env_file:
      - .env
    volumes:
      - "./исходные данные:/data:ro"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  nifi-setup:
    image: python:3.12-slim
    container_name: bdnifi-nifi-setup
    env_file:
      - .env
    volumes:
      - ./nifi/setup_flow.py:/setup_flow.py:ro
    environment:
      PYTHONUNBUFFERED: "1"
    command: python /setup_flow.py
    depends_on:
      nifi:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: "no"

  metabase:
    image: metabase/metabase:v0.49.15
    container_name: bdnifi-metabase
    env_file:
      - .env
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: 3000
    ports:
      - "${METABASE_PORT}:3000"
    volumes:
      - mbdata:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

  metabase-setup:
    image: python:3.12-slim
    container_name: bdnifi-metabase-setup
    env_file:
      - .env
    volumes:
      - ./metabase/setup_metabase.py:/setup_metabase.py:ro
    environment:
      PYTHONUNBUFFERED: "1"
    command: python /setup_metabase.py
    depends_on:
      metabase:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  nifidata:
  mbdata:
